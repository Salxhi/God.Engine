<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Universo</title>
<style>
  /* base xddd */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; }

  /* pantalla de entrada, pa desbloquear el audio en el movil */
  #pantalla-entrada{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 26px;
    background:
      radial-gradient(85% 55% at 50% 32%, rgba(22,22,44,.78) 0%, rgba(5,5,12,.96) 68%),
      #040408;
    opacity: 1;
    transition: opacity .85s ease;
  }
  #pantalla-entrada *{ border-radius: 0 !important; }
  #pantalla-entrada.oculto{
    opacity: 0;
    pointer-events: none;
  }

  .entrada-inner{
    position: relative;
    max-width: 420px;
    width: 100%;
  }

  .entrada-eyebrow{
    font-family: var(--sans, 'Space Grotesk', system-ui, sans-serif);
    font-size: 10.5px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: rgba(239,233,221,.38);
    margin-bottom: 30px;
    transform: rotate(-1deg);
  }

  .entrada-titulo{
    font-family: var(--serif, Georgia, serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(28px, 8.5vw, 44px);
    line-height: 1.1;
    color: #efe9dd;
    margin-bottom: 24px;
    transform: rotate(-.6deg);
    max-width: 340px;
  }
  .entrada-titulo em{
    font-style: italic;
    color: #ffb8d1;
  }

  .entrada-sub{
    font-family: var(--serif, Georgia, serif);
    font-size: 15px;
    line-height: 1.75;
    color: #9c9488;
    margin-bottom: 44px;
    max-width: 300px;
    transform: rotate(.4deg);
  }

  .btn-entrar{
    position: relative;
    display: inline-block;
    padding: 16px 30px 16px 34px;
    background: #efe9dd;
    color: #050505;
    border: none;
    font-family: var(--sans, 'Space Grotesk', system-ui, sans-serif);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    transform: rotate(-2deg);
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
    box-shadow: 6px 8px 0 rgba(0,0,0,.4);
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-entrar::after{
    content: '→';
    display: inline-block;
    margin-left: 14px;
    transform: translateY(-1px);
  }
  /* pulso del boton, no se que xddd */
  .btn-entrar{
    animation: pulsoEntrar 2.6s ease-in-out infinite;
  }
  .btn-entrar:active{
    animation: none;
    transform: rotate(0deg) scale(.96) !important;
    background: #fff;
    box-shadow: 2px 3px 0 rgba(0,0,0,.4);
  }
  @keyframes pulsoEntrar{
    0%,100%{ transform: rotate(-2deg) scale(1);    box-shadow: 6px 8px 0 rgba(0,0,0,.4); }
    50%    { transform: rotate(-2deg) scale(1.045); box-shadow: 9px 12px 0 rgba(0,0,0,.5); }
  }
  .btn-entrar:active{
    transform: rotate(0deg) scale(.96);
    background: #fff;
    box-shadow: 2px 3px 0 rgba(0,0,0,.4);
  }

  /* la cuenta regresiva xddd */
  #countdown {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    padding: 32px 28px;
    width: min(340px, 85vw);
    background: rgba(15, 15, 30, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 24px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #fff; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 40;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  #countdown.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #countdown .titulo { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 14px; }
  #countdown .fecha { font-size: 19px; font-weight: 500; margin-bottom: 26px; color: rgba(255,255,255,0.9); }
  #countdown .numero {
    font-size: 68px; font-weight: 300; line-height: 1; margin-bottom: 6px;
    background: linear-gradient(180deg, #fff 0%, #9bb4ff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; font-variant-numeric: tabular-nums;
  }
  #countdown .numero-label { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 1px; margin-bottom: 26px; }
  #countdown .divisor { height: 1px; width: 60%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); margin: 0 auto 22px; }
  #countdown .dia-n { font-size: 13px; color: rgba(255,255,255,0.6); letter-spacing: 0.5px; font-style: italic; }

  /* vista interior, rollo diario pegote xddd */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --planet-color: #ff6b9d; /* el js lo cambia por planeta xddd */
    --tinta: #efe9dd;
    --tinta-tenue: #9c9488;
    --fondo-hondo: #050505;
    --fondo-panel: #0b0a0a;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Space Grotesk', system-ui, sans-serif;
  }

  /* base del interior */
  #interior{
    position: fixed;
    inset: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    opacity: 0;
    touch-action: pan-y;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    transition: opacity .4s ease;
    z-index: 20;
  }
  #interior.visible{
    pointer-events: auto;
    opacity: 1;
  }
  /* fondo oscuro fijo abajo, para que el texto se lea bien xddd */
  #interior::before{
    content: '';
    position: fixed;
    top: 26vh;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 0%,
      rgba(11,10,10,0.55) 25%,
      var(--fondo-panel) 50%,
      var(--fondo-hondo) 100%);
    pointer-events: none;
    z-index: 0;
  }
  #interior *{
    border-radius: 0 !important; /* nada redondeado xddd */
  }

  /* hueco de arriba, ahi se ve el planeta xddd */
  .interior-gap{
    flex: 0 0 26vh;
    min-height: 26vh;
    width: 100%;
  }

  /* boton volver, entra deslizandose xddd */
  .btn-volver{
    position: fixed;
    top: max(18px, env(safe-area-inset-top, 0px));
    left: 16px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 10px 12px;
    background: rgba(5,5,5,.72);
    border: 1px solid rgba(239,233,221,.28);
    border-left: 3px solid var(--planet-color);
    color: var(--tinta);
    font-family: var(--sans);
    font-size: 12.5px;
    letter-spacing: .04em;
    text-transform: lowercase;
    transform: translateX(-140%) rotate(-2deg);
    opacity: 0;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease;
    clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 96%);
  }
  #interior.visible .btn-volver{
    animation: entraDesdeIzq .55s cubic-bezier(.2,.9,.25,1) .15s forwards;
  }
  .btn-volver:active{
    transform: translateX(0) rotate(-1deg) scale(.94);
    background: rgba(20,20,20,.9);
  }
  .btn-volver-flecha{ font-size: 15px; transform: translateY(-1px); }

  @keyframes entraDesdeIzq{
    0%{ transform: translateX(-140%) rotate(-6deg); opacity: 0; }
    60%{ transform: translateX(6%) rotate(1deg); opacity: 1; }
    100%{ transform: translateX(0) rotate(-2deg); opacity: 1; }
  }

  /* el panel de contenido, crece desde el planeta xddd */
  .interior-body{
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 94vh;
    padding: 34px 22px 90px;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 40%, var(--fondo-panel) 78%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0%, var(--fondo-panel) 55%, var(--fondo-hondo) 100%);
    transform-origin: 50% 0%;
    transform: scale(.3);
    opacity: 0;
    overflow: visible;
  }
  #interior.visible .interior-body{
    animation: crecerDesdePlaneta .62s cubic-bezier(.16,.9,.2,1.05) forwards;
  }
  @keyframes crecerDesdePlaneta{
    0%{ transform: scale(.3) translateY(-6%); opacity: 0; }
    70%{ transform: scale(1.03) translateY(0); opacity: 1; }
    100%{ transform: scale(1) translateY(0); opacity: 1; }
  }

  /* los hijos entran torcidos uno a uno xddd */
  .interior-body > *{
    opacity: 0;
    transform: translateY(26px) rotate(-1deg);
    animation: aparecerTorcido .5s cubic-bezier(.2,.8,.3,1) forwards;
  }
  .interior-body > .interior-header{ animation-delay: .32s; }
  .interior-body > .interior-carrusel-wrap{ animation-delay: .48s; }
  .interior-body > .interior-texto{ animation-delay: .66s; }

  @keyframes aparecerTorcido{
    to{ opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  /* header, numero, titulo y fecha regados xddd */
  .interior-header{
    position: relative;
    min-height: 128px;
    margin-bottom: 26px;
  }

  .interior-numero{
    position: absolute;
    top: -6px;
    left: -6px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 19vw;
    line-height: .8;
    color: transparent;
    -webkit-text-stroke: 1px rgba(239,233,221,.22);
    transform: rotate(-7deg);
    letter-spacing: -.03em;
    user-select: none;
    animation: flotarNumero 6s ease-in-out infinite;
    animation-delay: 1s;
  }
  @keyframes flotarNumero{
    0%,100%{ transform: rotate(-7deg) translateY(0); }
    50%{ transform: rotate(-5deg) translateY(-6px); }
  }

  .interior-titulo{
    position: relative;
    margin: 46px 0 0 8px;
    max-width: 78vw;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(30px, 9.5vw, 52px);
    line-height: 1.08;
    color: var(--tinta);
    transform: rotate(-1.4deg);
  }
  .interior-titulo::after{
    content: '';
    position: absolute;
    left: -4px;
    bottom: -8px;
    width: 62%;
    height: 6px;
    background: var(--planet-color);
    opacity: .6;
    clip-path: polygon(0 40%, 100% 0, 100% 60%, 0 100%);
    animation: trazoSubrayado .5s ease-out .95s both;
    transform-origin: left center;
  }
  @keyframes trazoSubrayado{
    from{ transform: scaleX(0); }
    to{ transform: scaleX(1); }
  }

  .interior-fecha{
    position: absolute;
    top: 4px;
    right: -4px;
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: .06em;
    color: var(--fondo-hondo);
    background: var(--tinta);
    padding: 5px 10px 5px 12px;
    transform: rotate(4deg);
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
    box-shadow: 3px 4px 0 rgba(0,0,0,.35);
    animation: bamboleoEtiqueta 4.5s ease-in-out infinite;
    animation-delay: 1.4s;
  }
  @keyframes bamboleoEtiqueta{
    0%,100%{ transform: rotate(4deg); }
    50%{ transform: rotate(6.5deg) translateY(-2px); }
  }

  .interior-header-linea{
    position: absolute;
    bottom: -14px;
    left: 4%;
    width: 55%;
    height: 1px;
    background: linear-gradient(90deg, var(--planet-color), transparent);
    opacity: .5;
  }

  /* el carrusel, fotos pegadas de cualquier manera xddd */
  .interior-carrusel-wrap{
    position: relative;
    margin: 0 -22px 30px;
    padding: 18px 0 26px;
  }

  .interior-carrusel{
    display: flex;
    align-items: flex-end;
    gap: 22px;
    overflow-x: auto;
    overflow-y: visible;
    scroll-snap-type: x mandatory;
    touch-action: pan-x;
    padding: 30px 30px 20px;
    scrollbar-width: none;
  }
  .interior-carrusel::-webkit-scrollbar{ display: none; }

  /* cada foto torcida distinto xddd */
  .interior-carrusel .media-item{
    position: relative;
    flex: 0 0 auto;
    width: 74vw;
    max-width: 380px;
    aspect-ratio: 4 / 5;
    scroll-snap-align: center;
    background: #111 center/cover no-repeat;
    border: 1px solid rgba(239,233,221,.16);
    box-shadow: 0 14px 28px rgba(0,0,0,.55);
    transform: rotate(-3deg);
    cursor: pointer;
    overflow: hidden;
    transition: transform .18s ease;
  }
  .interior-carrusel .media-item img,
  .interior-carrusel .media-item video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .interior-carrusel .media-item::before{
    /* cinta washi arriba, torcida xddd */
    content: '';
    position: absolute;
    top: -12px;
    left: 50%;
    width: 74px;
    height: 22px;
    background: var(--planet-color);
    opacity: .78;
    transform: translateX(-50%) rotate(-4deg);
    z-index: 2;
  }
  .interior-carrusel .media-item:nth-child(3n+1){ transform: rotate(-4deg) translateY(6px); }
  .interior-carrusel .media-item:nth-child(3n+2){ transform: rotate(3deg) translateY(-10px); }
  .interior-carrusel .media-item:nth-child(3n)  { transform: rotate(-1.5deg) translateY(2px); }
  .interior-carrusel .media-item:nth-child(3n+1)::before{ transform: translateX(-50%) rotate(6deg); }
  .interior-carrusel .media-item:nth-child(3n+2)::before{ transform: translateX(-50%) rotate(-8deg); left: 38%; }

  .interior-carrusel .media-item:active{
    transform: scale(.95) rotate(0deg) !important;
  }

  /* placeholder por si no hay src xddd */
  .interior-carrusel .media-item > .placeholder{
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      repeating-linear-gradient(45deg, rgba(239,233,221,.03) 0 12px, transparent 12px 24px),
      linear-gradient(135deg, rgba(239,233,221,.05) 0%, rgba(239,233,221,.01) 100%);
    color: rgba(239,233,221,.35);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  /* el triangulito de play en videos xddd */
  .interior-carrusel .media-item > .play-badge{
    position: absolute;
    bottom: 12px; right: 12px;
    width: 38px; height: 38px;
    background: rgba(5,5,5,.7);
    border: 1px solid rgba(239,233,221,.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tinta);
    font-size: 12px;
    z-index: 3;
    transform: rotate(3deg);
  }

  /* sombras a los lados pa insinuar mas fotos xddd */
  .interior-carrusel-sombra{
    position: absolute;
    top: 0; bottom: 0;
    width: 34px;
    pointer-events: none;
    z-index: 2;
  }
  .interior-carrusel-sombra.izq{ left: 0; background: linear-gradient(90deg, var(--fondo-panel), transparent); }
  .interior-carrusel-sombra.der{ right: 0; background: linear-gradient(-90deg, var(--fondo-panel), transparent); }

  /* el texto, como una nota escrita xddd */
  .interior-texto{
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    padding: 4px 6px 4px 22px;
    font-family: var(--serif);
    font-size: 18.5px;
    line-height: 1.85;
    color: var(--tinta);
    transform: rotate(.6deg);
    white-space: pre-line;
  }
  .interior-texto::before{
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 10px;
    width: 3px;
    background: repeating-linear-gradient(
      to bottom, var(--planet-color) 0 10px, transparent 10px 16px
    );
    opacity: .7;
  }

  /* el modal, la foto en grande xddd */
  #modal{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(2,2,2,.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  #modal.visible{
    opacity: 1;
    pointer-events: auto;
  }
  #modal *{ border-radius: 0 !important; }

  .modal-card{
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    background: #0a0a0a;
    border: 1px solid rgba(239,233,221,.18);
    border-top: 4px solid var(--planet-color);
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: scale(.72) rotate(-2deg);
    opacity: 0;
  }
  #modal.visible .modal-card{
    animation: golpeDeEntrada .38s cubic-bezier(.2,.9,.25,1.15) forwards;
  }
  @keyframes golpeDeEntrada{
    0%{ transform: scale(.7) rotate(-3deg); opacity: 0; }
    65%{ transform: scale(1.03) rotate(.6deg); opacity: 1; }
    100%{ transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .modal-media{
    width: 100%;
    max-height: 56vh;
    background: #000 center/contain no-repeat;
    overflow: hidden;
    border-bottom: 1px solid rgba(239,233,221,.14);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-media img, .modal-media video{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    animation: acercarSuave .5s ease-out;
  }
  @keyframes acercarSuave{
    from{ transform: scale(1.06); opacity: 0; }
    to{ transform: scale(1); opacity: 1; }
  }
  .modal-media .placeholder{
    width: 100%;
    height: 46vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      repeating-linear-gradient(45deg, rgba(239,233,221,.03) 0 14px, transparent 14px 28px),
      #0a0a0a;
    color: rgba(239,233,221,.35);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  .modal-texto-wrap{
    padding: 18px 20px 22px;
    overflow-y: auto;
  }
  .modal-titulo{
    font-family: var(--serif);
    font-style: italic;
    font-size: 19px;
    color: var(--tinta);
    margin-bottom: 8px;
    transform: rotate(-.4deg);
  }
  .modal-texto{
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--tinta-tenue);
    white-space: pre-line;
  }

  .btn-cerrar-modal{
    position: absolute;
    top: -14px;
    right: -10px;
    z-index: 5;
    width: 36px;
    height: 36px;
    background: var(--tinta);
    border: none;
    cursor: pointer;
    transform: rotate(8deg);
    transition: transform .12s ease;
  }
  .btn-cerrar-modal span{
    position: absolute;
    top: 50%; left: 50%;
    width: 16px;
    height: 2px;
    background: var(--fondo-hondo);
  }
  .btn-cerrar-modal span:first-child{ transform: translate(-50%,-50%) rotate(45deg); }
  .btn-cerrar-modal span:last-child{ transform: translate(-50%,-50%) rotate(-45deg); }
  .btn-cerrar-modal:active{ transform: rotate(0deg) scale(.9); }

  /* flash blanco pa la transicion al sol xddd */
  #flash-blanco{
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity .55s ease;
  }
  #flash-blanco.activo{ opacity: 1; }

  /* contador del sol, solo se ve en modo-sol xddd */
  #int-contador{
    display: none;
    position: relative;
    margin: 0 auto 32px;
    max-width: 520px;
    padding: 22px 20px 24px;
    background: rgba(255, 200, 120, .06);
    border-left: 3px solid var(--planet-color);
    transform: rotate(-.5deg);
  }
  #interior.modo-sol #int-contador{
    display: block;
    animation: aparecerTorcido .5s cubic-bezier(.2,.8,.3,1) .55s both;
  }
  .contador-titulo{
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(239,233,221,.5);
    margin-bottom: 16px;
  }
  .contador-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .contador-celda{ text-align: center; }
  .contador-numero{
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(22px, 6.5vw, 34px);
    line-height: 1;
    color: var(--tinta);
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .contador-label{
    font-family: var(--sans);

  #interior.tipo-ocean .interior-header::before{ content: '🌊'; }
  #interior.tipo-gas .interior-header::before{ content: '✨'; }
  #interior.tipo-lava .interior-header::before{ content: '🔥'; }
  #interior.tipo-ice .interior-header::before{ content: '❄️'; }
  @keyframes flotarSimbolo{ 0%,100%{ transform: rotate(6deg) translateY(0);} 50%{ transform: rotate(2deg) translateY(-8px);} }

  /* rocky, rollo diario de piedra xddd */
  #interior.tipo-rocky .interior-body{

  /* ocean, rollo cartas en botella xddd */

    background:
      radial-gradient(140% 70% at 50% 0%, color-mix(in srgb, var(--planet-color) 10%, transparent) 0%, transparent 45%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0%, var(--fondo-panel) 60%, var(--fondo-hondo) 100%);

  #interior.tipo-ocean .interior-carrusel{ align-items: center; }

    border-left: none;
    padding-left: 6px;
  }

  /* gas, rollo constelacion de recuerdos xddd */
  #interior.tipo-gas .interior-body{
    background:

    justify-content: center;

  }

    width: 40vw; max-width: 210px;
  }

    width: 100%; max-width: 100%; aspect-ratio: 16/10;
  }
  #interior.tipo-gas .interior-titulo{ text-transform: uppercase; letter-spacing: .01em; }

  /* lava, rollo cuaderno quemado xddd */
  #interior.tipo-lava .interior-body{

  /* ice, rollo cristal congelado xddd */
  #interior.tipo-ice .interior-body{

      radial-gradient(120% 60% at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 40%, var(--fondo-panel) 78%),
      linear-gradient(200deg, color-mix(in srgb, var(--planet-color) 10%, transparent) 0%, transparent 40%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0%, var(--fondo-panel) 55%, var(--fondo-hondo) 100%);
  }
  #interior.tipo-ice .interior-carrusel .media-item{

  /* cosas solo del sol, na de esto toca a los planetas xddd */

  /* polvillo subiendo xddd */

  #interior.modo-sol .interior-polvo{
    display: block;
    position: absolute;
    bottom: -8vh;
    width: 3px; height: 3px;

    opacity: 0;
    animation: subirPolvo 5.5s ease-in infinite;
  }
  #interior.modo-sol .interior-polvo:nth-child(1){ left: 18%; animation-delay: .2s; }
  #interior.modo-sol .interior-polvo:nth-child(2){ left: 34%; animation-delay: 1.6s; width:2px; height:2px; }
  #interior.modo-sol .interior-polvo:nth-child(3){ left: 52%; animation-delay: .8s; }
  #interior.modo-sol .interior-polvo:nth-child(4){ left: 67%; animation-delay: 2.4s; width:2px; height:2px; }
  #interior.modo-sol .interior-polvo:nth-child(5){ left: 81%; animation-delay: 3.1s; }
  #interior.modo-sol .interior-polvo:nth-child(6){ left: 45%; animation-delay: 4s; width:2px; height:2px; }
  #interior.modo-sol .interior-polvo:nth-child(7){ left: 9%;  animation-delay: 1.1s; }
  #interior.modo-sol .interior-polvo:nth-child(8){ left: 25%; animation-delay: 3.4s; width:2px; height:2px; }
  #interior.modo-sol .interior-polvo:nth-child(9){ left: 60%; animation-delay: 2.9s; }
  #interior.modo-sol .interior-polvo:nth-child(10){ left: 90%; animation-delay: .6s; width:2px; height:2px; }
  @keyframes subirPolvo{
    0%{ transform: translateY(0) scale(.4); opacity: 0; }
    15%{ opacity: 1; }
    85%{ opacity: .7; }
    100%{ transform: translateY(-46vh) scale(1); opacity: 0; }
  }

  /* svg dibujado a mano pa el sol xddd */
  .interior-header-svg{ display: none; }
  #interior.modo-sol .interior-header-svg{
    display: block;
    position: absolute;
    left: -6px; bottom: -20px;
    width: 68%; max-width: 320px; height: 20px;
    overflow: visible;
  }
  #interior.modo-sol .interior-header-svg path{
    fill: none;
    stroke: var(--planet-color);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    opacity: .85;
    animation: dibujarTrazo 1s cubic-bezier(.3,.8,.3,1) 1.05s forwards;
  }
  @keyframes dibujarTrazo{ to{ stroke-dashoffset: 0; } }
  /* en modo sol quitamos el subrayado normal xddd */
  #interior.modo-sol .interior-titulo::after{ display: none; }

  /* aura que respira detras del panel xddd */
  #interior.modo-sol .interior-body::before{
    content: '';
    position: absolute;
    inset: -10% -10% auto -10%;
    height: 78%;
    background:
      conic-gradient(from 0deg at 50% 0%,
        color-mix(in srgb, var(--planet-color) 14%, transparent),
        transparent 12%, transparent 88%,
        color-mix(in srgb, var(--planet-color) 14%, transparent)),
      radial-gradient(60% 100% at 50% 0%,
        color-mix(in srgb, var(--planet-color) 26%, transparent), transparent 70%);
    opacity: .6;
    pointer-events: none;
    animation: respirarAura 5s ease-in-out infinite, girarSunburst 40s linear infinite;
  }
  @keyframes respirarAura{
    0%,100%{ opacity: .45; }
    50%{ opacity: .75; }
  }
  @keyframes girarSunburst{ to{ transform: rotate(360deg); } }

  /* el sol se merece un titulo bien grande xddd */
  #interior.modo-sol .interior-titulo{
    font-size: clamp(38px, 12vw, 68px);
  }
  #interior.modo-sol .interior-texto{
    font-size: 20px;
    max-width: 680px;
  }

  /* contador dorado xddd */
  #interior.modo-sol .contador-grid{ gap: 14px; }
  #interior.modo-sol .contador-celda{
    padding: 10px 4px;
    background: color-mix(in srgb, var(--planet-color) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--planet-color) 30%, transparent);
  }
  #interior.modo-sol .contador-numero{
    text-shadow: 0 0 16px color-mix(in srgb, var(--planet-color) 65%, transparent);
  }

  /* firmita del sol xddd */
  #interior.modo-sol .interior-texto::after{
    content: '☀';
    display: block;
    margin-top: 28px;
    font-size: 22px;
    color: var(--planet-color);
    text-align: center;
    opacity: .8;
  }

  /* brillo que recorre el titulo xddd */
  #interior.modo-sol .interior-titulo{
    background: linear-gradient(100deg, var(--tinta) 30%, var(--planet-color) 48%, var(--tinta) 66%);
    background-size: 260% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: brilloTitulo 4.5s ease-in-out 1.3s infinite;
  }
  @keyframes brilloTitulo{
    0%,15%{ background-position: 100% 0; }
    50%{ background-position: 0% 0; }
    85%,100%{ background-position: -60% 0; }
  }

  /* numero con mas glow xddd */
  #interior.modo-sol .interior-numero{
    -webkit-text-stroke: 1px color-mix(in srgb, var(--tinta) 30%, transparent);
    animation: flotarNumeroSol 6s ease-in-out infinite 1.1s;
  }
  @keyframes flotarNumeroSol{
    0%,100%{ transform: rotate(-7deg) translateY(0);
      filter: drop-shadow(0 0 10px color-mix(in srgb, var(--planet-color) 35%, transparent)); }
    50%{ transform: rotate(-5deg) translateY(-7px);
      filter: drop-shadow(0 0 20px color-mix(in srgb, var(--planet-color) 60%, transparent)); }
  }

  /* fecha con destello metalico xddd */
  #interior.modo-sol .interior-fecha{ overflow: hidden; }
  #interior.modo-sol .interior-fecha::after{
    content: '';
    position: absolute;
    top: -40%; left: -60%;
    width: 40%; height: 180%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,.85), transparent);
    transform: rotate(10deg);
    animation: brilloEtiqueta 3.6s ease-in-out 2s infinite;
    pointer-events: none;
  }
  @keyframes brilloEtiqueta{
    0%,60%,100%{ left: -60%; }
    80%{ left: 130%; }
  }

  /* fotos con brillito y 3D xddd */
  #interior.modo-sol .interior-carrusel-wrap{ perspective: 900px; }
  #interior.modo-sol .interior-carrusel .media-item::after{
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.5) 50%, transparent 60%);
    transform: translateX(-120%);
    animation: brilloFoto 2.6s ease-out .2s 1;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes brilloFoto{ to{ transform: translateX(120%); } }
  #interior.modo-sol .interior-carrusel .media-item:nth-child(3n+1){ transform: rotate(-4deg) translateY(8px) rotateY(3deg); }
  #interior.modo-sol .interior-carrusel .media-item:nth-child(3n+2){ transform: rotate(3deg) translateY(-12px) rotateY(-3deg); }

  /* letra capital xddd */
  #interior.modo-sol .interior-texto::first-letter{
    font-size: 2.6em;
    font-style: italic;
    font-weight: 600;
    color: var(--planet-color);
    float: left;
    line-height: .8;
    margin: .04em .08em 0 0;
  }

  /* modal con esquinitas de camara xddd */
  .modal-esquina{ display: none; }
  #modal.modo-sol .modal-esquina{
    display: block;
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--planet-color);
    opacity: 0;
    animation: dibujarEsquina .3s ease-out .25s forwards;
    pointer-events: none;
  }
  #modal.modo-sol .modal-esquina.tl{ top: -8px; left: -8px; border-top: 2px solid; border-left: 2px solid; }
  #modal.modo-sol .modal-esquina.tr{ top: -8px; right: -8px; border-top: 2px solid; border-right: 2px solid; }
  #modal.modo-sol .modal-esquina.bl{ bottom: -8px; left: -8px; border-bottom: 2px solid; border-left: 2px solid; }
  #modal.modo-sol .modal-esquina.br{ bottom: -8px; right: -8px; border-bottom: 2px solid; border-right: 2px solid; }
  @keyframes dibujarEsquina{ from{ opacity:0; transform: scale(1.6);} to{ opacity:1; transform: scale(1);} }

  /* pa quien no quiera animaciones xddd */
  @media (prefers-reduced-motion: reduce){
    #interior *, #modal *, #pantalla-entrada *{
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .interior-numero, .interior-fecha, .interior-titulo,
    .interior-body::before, .interior-polvo,
    .interior-header-svg path, .interior-fecha::after,
    .interior-carrusel .media-item::after, .modal-esquina{
      animation: none !important;
    }
  }
</style>

function fechaDePlaneta(id) {
  const f = new Date(config.fechaInicio + "T00:00:00");
  f.setDate(f.getDate() + (id - 1));
  return f;
}
function estaDesbloqueadoPorFecha(id) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return hoy >= fechaDePlaneta(id);
}
function calcularDiasRestantes(id) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((fechaDePlaneta(id) - hoy) / 86400000));
}
function calcularDiaDesdeCreacion() {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const c = new Date(config.fechaCreacionCarta + "T00:00:00");
  return Math.max(1, Math.floor((hoy - c) / 86400000) + 1);
}
function formatearFecha(fecha) {
  return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
}

const AUDIO_DISPONIBLE = typeof Howl !== 'undefined';

const audio = {
  ambiente: null,
  canciones: new Map(),
  desbloqueado: false,
  planetaActivoId: null
};

function crearHowl(src, { loop = false } = {}) {
  if (!AUDIO_DISPONIBLE || !src) return null;
  try {
    return new Howl({
      src: [src],
      loop,
      volume: 0,
      preload: true,
      html5: false
    });
  } catch (e) {
    console.warn('[audio] No se pudo crear Howl:', src, e);
    return null;
  }
}

// fade in robusto, por si aun estaba cargando xddd
function fadeInHowl(howl, volObjetivo, duracionMs) {
  if (!howl) return;
  if (howl.playing()) {
    howl.fade(howl.volume(), volObjetivo, duracionMs);
    return;
  }
  howl.volume(0);
  howl.once('play', () => {
    howl.fade(0, volObjetivo, duracionMs);
  });
  howl.play();
}

function fadeOutHowl(howl, duracionMs, detener = false) {
  if (!howl) return;
  howl.fade(howl.volume(), 0, duracionMs);
  if (detener) {
    setTimeout(() => {
      try { howl.stop(); } catch {}
    }, duracionMs + 80);
  }
}

// arranca el ambiente, se llama tras el tap de entrar xddd
function iniciarAmbiente() {
  if (!AUDIO_DISPONIBLE) {
    console.warn('[audio] Howler no está disponible.');
    return;
  }
  audio.desbloqueado = true;
  if (!config.musicaAmbiente) return;
  if (!audio.ambiente) {
    audio.ambiente = crearHowl(config.musicaAmbiente, { loop: true });
  }
  if (!audio.ambiente) return;
  fadeInHowl(audio.ambiente, config.volumenAmbiente, config.fadeEntradaMs);
}

function bajarAmbiente() {
  if (!audio.ambiente) return;
  fadeInHowl(audio.ambiente, config.volumenAmbiente * 0.25, config.fadeSalidaMs);
}

function subirAmbiente() {
  if (!audio.ambiente) return;
  fadeInHowl(audio.ambiente, config.volumenAmbiente, config.fadeEntradaMs);
}

// entrar a un planeta, baja ambiente y sube cancion xddd
function entrarCancionPlaneta(cfg) {
  if (!AUDIO_DISPONIBLE) return;
  audio.planetaActivoId = cfg.id;
  bajarAmbiente();
  if (!cfg.cancion) return;

  let howl = audio.canciones.get(cfg.id);
  if (!howl) {
    howl = crearHowl(cfg.cancion, { loop: true });
    if (!howl) return;
    audio.canciones.set(cfg.id, howl);
  }
  fadeInHowl(howl, config.volumenCancion, config.fadeEntradaMs);
}

// volver al universo, baja cancion y sube ambiente xddd
function salirCancionPlaneta() {
  if (!AUDIO_DISPONIBLE) return;
  const id = audio.planetaActivoId;
  audio.planetaActivoId = null;
  if (id !== null) {
    const howl = audio.canciones.get(id);
    if (howl) fadeOutHowl(howl, config.fadeSalidaMs, true);
  }
  subirAmbiente();
}

  return new THREE.Points(g, new THREE.PointsMaterial({

  }));

function crearTexturaNebulosa(colorHex) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const c = new THREE.Color(colorHex);
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, `rgba(${Math.floor(c.r*255)}, ${Math.floor(c.g*255)}, ${Math.floor(c.b*255)}, 0.45)`);
  grad.addColorStop(0.5, `rgba(${Math.floor(c.r*255)}, ${Math.floor(c.g*255)}, ${Math.floor(c.b*255)}, 0.12)`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

const ESTRELLAS_FUGACES_COUNT = 4;
const estrellasFugaces = [];

function crearEstrellaFugaz() {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(6); // 2 puntos x 3 coords xddd
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const linea = new THREE.Line(geo, mat);
  linea.frustumCulled = false;
  scene.add(linea);
  return {
    linea, geo, mat, pos,
    activa: false,
    t: 0, dur: 1,
    inicio: new THREE.Vector3(),
    direccion: new THREE.Vector3(),
    longitud: 60,
    espera: 2 + Math.random() * 6
  };
}

for (let i = 0; i < ESTRELLAS_FUGACES_COUNT; i++) {
  estrellasFugaces.push(crearEstrellaFugaz());
}

function lanzarEstrellaFugaz(ef) {
  const radio = 500 + Math.random() * 400;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 1.6 - 0.8));
  ef.inicio.set(
    radio * Math.sin(phi) * Math.cos(theta),
    radio * Math.sin(phi) * Math.sin(theta) * 0.7,
    radio * Math.cos(phi)
  );
  ef.direccion.set(
    (Math.random() - 0.5) * 2,
    (Math.random() - 0.6) * 1.2,
    (Math.random() - 0.5) * 2
  ).normalize();
  ef.longitud = 50 + Math.random() * 70;
  ef.dur = 0.8 + Math.random() * 0.7;
  ef.t = 0;
  ef.activa = true;
  ef.mat.opacity = 0;
}

function actualizarEstrellasFugaces(dt) {
  for (const ef of estrellasFugaces) {
    if (!ef.activa) {
      ef.espera -= dt;
      if (ef.espera <= 0) lanzarEstrellaFugaz(ef);
      continue;
    }
    ef.t += dt / ef.dur;
    if (ef.t >= 1) {
      ef.activa = false;
      ef.mat.opacity = 0;
      ef.espera = 4 + Math.random() * 8;
      continue;
    }
    const avance = ef.t * 900;
    const cx = ef.inicio.x + ef.direccion.x * avance;
    const cy = ef.inicio.y + ef.direccion.y * avance;
    const cz = ef.inicio.z + ef.direccion.z * avance;
    ef.pos[0] = cx;
    ef.pos[1] = cy;
    ef.pos[2] = cz;
    ef.pos[3] = cx - ef.direccion.x * ef.longitud;
    ef.pos[4] = cy - ef.direccion.y * ef.longitud;
    ef.pos[5] = cz - ef.direccion.z * ef.longitud;
    ef.geo.attributes.position.needsUpdate = true;
    const f = ef.t < 0.2 ? ef.t / 0.2 : (ef.t > 0.8 ? (1 - ef.t) / 0.2 : 1);
    ef.mat.opacity = f * 0.9;
  }
}

// rayos del sol girando lentito xddd
function crearTexturaRayos() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2;
  const rayos = 16;
  for (let i = 0; i < rayos; i++) {
    const ang = (i / rayos) * Math.PI * 2;
    const largo = size * (0.3 + (i % 3) * 0.08);
    const grad = ctx.createLinearGradient(cx, cy, cx + Math.cos(ang) * largo, cy + Math.sin(ang) * largo);
    grad.addColorStop(0, 'rgba(255,200,120,0.55)');
    grad.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 10 + (i % 4) * 6;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * largo, cy + Math.sin(ang) * largo);
    ctx.stroke();
  }
  return new THREE.CanvasTexture(canvas);
}
const rayosSol = new THREE.Sprite(new THREE.SpriteMaterial({
  map: crearTexturaRayos(), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending
}));

// TEXTURAS HECHAS CON CANVAS XDDD
// ============================================
function crearTexturaProcedural(tipo, colorHex) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const base = new THREE.Color(colorHex);
  const r = Math.floor(base.r * 255);
  const g = Math.floor(base.g * 255);
  const b = Math.floor(base.b * 255);
  ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
  ctx.fillRect(0, 0, size, size);

  if (tipo === 'rocky') {
    for (let i = 0; i < 220; i++) {
      const x = Math.random() * size, y = Math.random() * size, rad = Math.random() * 35 + 6;
      const factor = 0.55 + Math.random() * 0.75;
      ctx.fillStyle = `rgba(${Math.floor(r*factor)}, ${Math.floor(g*factor)}, ${Math.floor(b*factor)}, 0.35)`;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
  } else if (tipo === 'gas') {
    for (let i = 0; i < 55; i++) {
      const y = Math.random() * size, h = Math.random() * 22 + 6;
      const factor = 0.65 + Math.random() * 0.7;
      ctx.fillStyle = `rgba(${Math.floor(r*factor)}, ${Math.floor(g*factor)}, ${Math.floor(b*factor)}, 0.5)`;
      ctx.fillRect(0, y, size, h);
    }
    for (let i = 0; i < 10; i++) {
      const y = Math.random() * size;
      ctx.fillStyle = `rgba(255, 255, 255, 0.06)`;
      ctx.fillRect(0, y, size, 3);
    }
  } else if (tipo === 'ocean') {
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * size, y = Math.random() * size, rad = Math.random() * 70 + 25;
      const factor = 0.5 + Math.random() * 0.9;
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, rad);
      gradient.addColorStop(0, `rgba(${Math.floor(r*factor)}, ${Math.floor(g*factor)}, ${Math.floor(b*factor)}, 0.4)`);
      gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
      ctx.fillStyle = gradient;
      ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
  } else if (tipo === 'ice') {
    for (let i = 0; i < 90; i++) {
      ctx.lineWidth = Math.random() * 2.5 + 0.5;
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 + Math.random() * 0.35})`;
      ctx.beginPath();
      let x = Math.random() * size, y = Math.random() * size;
      ctx.moveTo(x, y);
      for (let j = 0; j < 5; j++) {
        x += (Math.random() - 0.5) * 110; y += (Math.random() - 0.5) * 110;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * size, y = Math.random() * size, rad = Math.random() * 30 + 8;
      ctx.fillStyle = `rgba(255, 255, 255, 0.12)`;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
  } else if (tipo === 'lava') {
    for (let i = 0; i < 130; i++) {
      const x = Math.random() * size, y = Math.random() * size, rad = Math.random() * 45 + 10;
      ctx.fillStyle = `rgba(15, 8, 5, 0.55)`;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 45; i++) {
      ctx.lineWidth = Math.random() * 2.5 + 0.6;
      ctx.strokeStyle = `rgba(255, 160, 60, ${0.4 + Math.random() * 0.5})`;
      ctx.beginPath();
      let x = Math.random() * size, y = Math.random() * size;
      ctx.moveTo(x, y);
      for (let j = 0; j < 4; j++) {
        x += (Math.random() - 0.5) * 90; y += (Math.random() - 0.5) * 90;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

// ANILLOS DE LOS PLANETAS XDDD
// ============================================
function crearAnillo(rIn, rOut, colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 1;
  const ctx = canvas.getContext('2d');
  const color = new THREE.Color(colorHex);
  const cr = Math.floor(color.r * 255), cg = Math.floor(color.g * 255), cb = Math.floor(color.b * 255);
  for (let x = 0; x < 256; x++) {
    const alpha = Math.random() * 0.6 + 0.15;
    const factor = 0.65 + Math.random() * 0.5;
    ctx.fillStyle = `rgba(${Math.floor(cr*factor)}, ${Math.floor(cg*factor)}, ${Math.floor(cb*factor)}, ${alpha})`;
    ctx.fillRect(x, 0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  const geo = new THREE.RingGeometry(rIn, rOut, 96);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  const v3 = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);
    const dist = v3.length();
    const t = (dist - rIn) / (rOut - rIn);
    uv.setXY(i, t, 0.5);
  }
  uv.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.9
  });
  const anillo = new THREE.Mesh(geo, mat);
  anillo.rotation.x = -Math.PI / 2;
  return anillo;
}

// LA LINEA DE LA ORBITA XDDD
// ============================================
function crearLineaOrbita(radio, color) {
  const pos = new Float32Array(ORBIT_SEGMENTS * 3);
  const col = new Float32Array(ORBIT_SEGMENTS * 3);
  const baseColor = new THREE.Color(color);
  for (let i = 0; i < ORBIT_SEGMENTS; i++) {
    const phi = (i / ORBIT_SEGMENTS) * Math.PI * 2;
    pos[i*3]     = Math.cos(phi) * radio;
    pos[i*3 + 1] = 0;
    pos[i*3 + 2] = -Math.sin(phi) * radio;
    col[i*3] = baseColor.r * 0.05;
    col[i*3 + 1] = baseColor.g * 0.05;
    col[i*3 + 2] = baseColor.b * 0.05;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.45,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const linea = new THREE.LineLoop(g, m);
  linea.userData.colorBase = baseColor;
  return linea;
}

const planetas = [];

function crearPlaneta(cfg) {
  const desbloqueado = desbloqueadosGuardados.has(cfg.id);
  const tiltGroup = new THREE.Group();
  tiltGroup.rotation.z = THREE.MathUtils.degToRad(cfg.inclinacion);
  tiltGroup.rotation.x = THREE.MathUtils.degToRad(cfg.inclinacionX || 0);
  const spinner = new THREE.Group();
  const orbita = crearLineaOrbita(cfg.distancia, cfg.color);
  tiltGroup.add(orbita);

  let mat;
  if (desbloqueado) {
    const textura = crearTexturaProcedural(cfg.tipo, cfg.color);
    mat = new THREE.MeshStandardMaterial({
      map: textura, emissive: cfg.color, emissiveIntensity: 0.08,
      roughness: 0.9, metalness: 0.05
    });
  } else {
    mat = new THREE.MeshStandardMaterial({
      color: 0x8080a0, emissive: 0x101018, emissiveIntensity: 0.4,
      roughness: 0.6, metalness: 0.3
    });
  }

  const geo = new THREE.SphereGeometry(cfg.tamano, 48, 48);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(cfg.distancia, 0, 0);
  mesh.userData.planetaId = cfg.id;
  spinner.add(mesh);

  let atmosfera = null;
  if (desbloqueado) {
    atmosfera = new THREE.Mesh(
      new THREE.SphereGeometry(cfg.tamano * 1.22, 32, 32),
      new THREE.MeshBasicMaterial({
        color: cfg.color, transparent: true, opacity: 0.18,
        side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending
      })
    );
    atmosfera.position.copy(mesh.position);
    spinner.add(atmosfera);
  }

  let anillo = null;
  if (desbloqueado && cfg.anillo) {
    anillo = crearAnillo(cfg.tamano * 1.5, cfg.tamano * 2.5, cfg.color);
    anillo.position.copy(mesh.position);
    spinner.add(anillo);
  }

  let candado = null;
  if (!desbloqueado) {
    const spriteMat = new THREE.SpriteMaterial({
      map: texturaCandado, transparent: true, opacity: 0.9, depthWrite: false
    });
    candado = new THREE.Sprite(spriteMat);
    candado.position.set(cfg.distancia, 0, 0);
    const tam = cfg.tamano * 1.05;
    candado.scale.set(tam, tam, 1);
    spinner.add(candado);
  }

  const hitGeo = new THREE.SphereGeometry(cfg.tamano * HITBOX_MULTIPLIER, 12, 12);
  const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
  const hitbox = new THREE.Mesh(hitGeo, hitMat);
  hitbox.position.copy(mesh.position);
  hitbox.userData.planetaId = cfg.id;
  spinner.add(hitbox);

  tiltGroup.add(spinner);
  scene.add(tiltGroup);

  return {
    tiltGroup, spinner, mesh, hitbox, orbita, candado, anillo,
    cfg, desbloqueado,
    colorBase: new THREE.Color(cfg.color),
    orbitColors: orbita.geometry.attributes.color
  };
}

const esperar = (ms) => new Promise(r => setTimeout(r, ms));

// transicion de camara con gsap, si no hay gsap pues normal xddd
function animarCamara(posI, targetI, posF, targetF, duracion) {
  return new Promise(resolve => {
    const gsapOk = typeof gsap !== 'undefined';

    if (!gsapOk) {
      const t0 = performance.now();
      function paso() {
        const el = (performance.now() - t0) / 1000;
        const t = Math.min(1, el / duracion);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(posI, posF, ease);
        controls.target.lerpVectors(targetI, targetF, ease);
        camera.lookAt(controls.target);
        if (t < 1) requestAnimationFrame(paso);
        else resolve();
      }
      paso();
      return;
    }

    // punto medio elevado pa que la camara haga un arco xddd
    const dist = posI.distanceTo(posF);
    const mid = posI.clone().lerp(posF, 0.5);
    mid.y += Math.min(dist * 0.14, 18);

    const prog = { t: 0 };
    const p = new THREE.Vector3();
    const tgt = new THREE.Vector3();

    gsap.to(prog, {
      t: 1,
      duration: duracion,
      ease: 'power2.inOut',
      onUpdate: () => {
        const t = prog.t;
        const it = 1 - t;
        p.set(
          it * it * posI.x + 2 * it * t * mid.x + t * t * posF.x,
          it * it * posI.y + 2 * it * t * mid.y + t * t * posF.y,
          it * it * posI.z + 2 * it * t * mid.z + t * t * posF.z
        );
        camera.position.copy(p);
        tgt.lerpVectors(targetI, targetF, t);
        controls.target.copy(tgt);
        camera.lookAt(controls.target);
      },
      onComplete: resolve
    });
  });
}

let contadorInterval = null;

function iniciarContadorVivo() {
  detenerContadorVivo();
  const aniversario = new Date(config.aniversario + "T00:00:00");
  const cD = document.getElementById('cont-dias');
  const cH = document.getElementById('cont-horas');
  const cM = document.getElementById('cont-min');
  const cS = document.getElementById('cont-seg');
  function tic() {
    const diff = Date.now() - aniversario.getTime();
    if (diff < 0) return;
    const dias  = Math.floor(diff / 86400000);
    const horas = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const segs  = Math.floor((diff % 60000) / 1000);
    if (cD) cD.textContent = dias;
    if (cH) cH.textContent = String(horas).padStart(2, '0');
    if (cM) cM.textContent = String(mins).padStart(2, '0');
    if (cS) cS.textContent = String(segs).padStart(2, '0');
  }
  tic();
  contadorInterval = setInterval(tic, 1000);
}

function detenerContadorVivo() {
  if (contadorInterval) { clearInterval(contadorInterval); contadorInterval = null; }
}

  interiorEl.style.setProperty('--planet-color', colorCSS);
  modalEl.style.setProperty('--planet-color', colorCSS);

  // el modo sol tambien se refleja en el modal xddd
  if (esSol) modalEl.classList.add('modo-sol');
  else modalEl.classList.remove('modo-sol');

  // quitamos la clase tipo anterior y ponemos la nueva xddd
  const TIPOS_MUNDO = ['rocky', 'ocean', 'gas', 'lava', 'ice'];
  TIPOS_MUNDO.forEach(t => {
    interiorEl.classList.remove('tipo-' + t);
    modalEl.classList.remove('tipo-' + t);
  });
  if (!esSol && cfg.tipo) {
    interiorEl.classList.add('tipo-' + cfg.tipo);
    modalEl.classList.add('tipo-' + cfg.tipo);
  }

  intNumero.textContent = esSol ? '☉' : String(cfg.id).padStart(2, '0');
  intTitulo.textContent = cfg.titulo || `Recuerdo ${cfg.id}`;
  intFecha.textContent = esSol ? formatearFecha(fechaSol) : formatearFecha(fechaDePlaneta(cfg.id));
  intTexto.textContent = cfg.texto || '';

  intCarrusel.innerHTML = '';
  carruselIndex = 0;
  const media = cfg.media || [];

  media.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'media-item';
    item.dataset.index = i;

    if (m.src) {
      if (m.tipo === 'video') {
        const v = document.createElement('video');
        v.src = m.src;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.autoplay = true;
        item.appendChild(v);
      } else {
        const img = document.createElement('img');
        img.src = m.src;
        img.alt = '';
        item.appendChild(img);
      }
    } else {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = m.tipo === 'video' ? `Video ${i + 1}` : `Foto ${i + 1}`;
      item.appendChild(ph);
    }

    if (m.tipo === 'video') {
      const badge = document.createElement('div');
      badge.className = 'play-badge';
      badge.textContent = '▶';
      item.appendChild(badge);
    }

    item.addEventListener('click', () => abrirModal(m));
    intCarrusel.appendChild(item);
  });

  iniciarCarrusel();

  intCarrusel.addEventListener('pointerdown', () => detenerCarrusel(), { once: true });
  intCarrusel.addEventListener('pointerup', () => {
    setTimeout(iniciarCarrusel, CARRUSEL_INTERVALO_MS);
  }, { once: true });
}

// ============================================
// EL MODAL XDDD
// ============================================
let modalAbierto = false;

function abrirModal(m) {
  if (modalAbierto) return;
  modalAbierto = true;
  detenerCarrusel();

  modalMedia.innerHTML = '';
  if (m.src) {
    if (m.tipo === 'video') {
      const v = document.createElement('video');
      v.src = m.src;
      v.controls = true;
      v.autoplay = true;
      v.playsInline = true;
      v.loop = true;
      modalMedia.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = m.src;
      modalMedia.appendChild(img);
    }
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = m.tipo === 'video' ? 'Video' : 'Foto';
    modalMedia.appendChild(ph);
  }

  modalTitulo.textContent = m.tipo === 'video' ? 'Video' : 'Foto';
  modalTexto.textContent = m.texto || '';
  modalEl.classList.add('visible');
}

function cerrarModal() {
  if (!modalAbierto) return;
  modalAbierto = false;
  modalEl.classList.remove('visible');
  setTimeout(iniciarCarrusel, 400);
}

btnCerrarModal.addEventListener('click', cerrarModal);
modalEl.addEventListener('click', (e) => {
  if (e.target === modalEl) cerrarModal();
});

// ============================================
// RAYCASTER Y TAP XDDD
// ============================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const TAP_MAX_TIEMPO_MS = 300;
const TAP_MAX_MOVIMIENTO_PX = 12;
let pointerDownInfo = null;

function getPointerNDC(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  return pointer;
}

function onPointerDown(event) {
  if (vistaInteriorActiva) return;
  pointerDownInfo = { x: event.clientX, y: event.clientY, time: performance.now() };
}

function onPointerUp(event) {
  if (vistaInteriorActiva || !pointerDownInfo) return;
  const dx = event.clientX - pointerDownInfo.x;
  const dy = event.clientY - pointerDownInfo.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const dur = performance.now() - pointerDownInfo.time;
  pointerDownInfo = null;
  if (dist > TAP_MAX_MOVIMIENTO_PX) return;
  if (dur > TAP_MAX_TIEMPO_MS) return;
  detectarToque(event);
}

function detectarToque(event) {
  getPointerNDC(event);
  raycaster.setFromCamera(pointer, camera);
  const objetos = [...planetas.map(p => p.hitbox), solHitbox];
  const intersecciones = raycaster.intersectObjects(objetos, false);
  if (intersecciones.length === 0) return;
  const hit = intersecciones[0].object;
  if (hit.userData.esSol) {
    if (solDesbloqueado) entrarAlSol();
    else mostrarCuentaRegresivaSol();
    return;
  }
  const id = hit.userData.planetaId;
  if (id === undefined) return;
  const planetaData = planetas.find(p => p.cfg.id === id);
  if (!planetaData) return;
  if (planetaData.desbloqueado) {
    entrarAlPlaneta(planetaData);
  } else {
    mostrarCuentaRegresiva(planetaData.cfg);
    // el planeta late un poco si esta bloqueado xddd
    const est = planetasTocados.get(planetaData.cfg.id);
    if (est) {
      est.escalaObjetivo = 1.35;
      setTimeout(() => { est.escalaObjetivo = 1; }, 220);
    }
  }
}

// ============================================
// LA CUENTA REGRESIVA XDDD
// ============================================
let countdownTimeout = null;
function mostrarCuentaRegresiva(cfg) {
  const dias = calcularDiasRestantes(cfg.id);
  const diaN = calcularDiaDesdeCreacion();
  cdFecha.textContent = formatearFecha(fechaDePlaneta(cfg.id));
  cdNumero.textContent = dias;
  cdNumeroLabel.textContent = dias === 1 ? "día" : "días";
  cdDiaN.textContent = `Día ${diaN} desde que preparé esto para ti`;
  countdownEl.classList.add('visible');
  if (countdownTimeout) clearTimeout(countdownTimeout);
  countdownTimeout = setTimeout(() => countdownEl.classList.remove('visible'), 3500);
}
countdownEl.addEventListener('pointerdown', e => e.stopPropagation());

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (countdownEl.classList.contains('visible')) countdownEl.classList.remove('visible');
  onPointerDown(e);
});
renderer.domElement.addEventListener('pointerup', onPointerUp);

btnVolver.addEventListener('click', volverAlUniverso);

// ============================================
// RESIZE XDDD
// ============================================
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  if (usarPostFX && composer) {
    composer.setSize(window.innerWidth, window.innerHeight);
    if (bloomPass) bloomPass.setSize(window.innerWidth, window.innerHeight);
  }
}
window.addEventListener('resize', onResize);

// ============================================
// LA ANIMACION XDDD
// ============================================
let ultimaVez = performance.now();
let rafActivo = true; // pausamos el rAF si la pestaña no se ve xddd

function actualizarBrilloOrbita(p, anguloActual) {
  const count = ORBIT_SEGMENTS;
  const colAttr = p.orbitColors;
  const base = p.colorBase;
  for (let i = 0; i < count; i++) {
    const phi = (i / count) * Math.PI * 2;
    let diff = Math.abs(phi - anguloActual) % (Math.PI * 2);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    const pico = Math.max(0, 1 - diff / (Math.PI / 8));
    const intensidad = 0.005 + Math.pow(pico, 2) * 0.2;
    colAttr.array[i*3]     = base.r * intensidad;
    colAttr.array[i*3 + 1] = base.g * intensidad;
    colAttr.array[i*3 + 2] = base.b * intensidad;
  }
  colAttr.needsUpdate = true;
}

function animar() {
  const ahora = performance.now();
  const dt = Math.min(0.1, (ahora - ultimaVez) / 1000);
  ultimaVez = ahora;

  tiempoRotacion += dt;
  if (!vistaInteriorActiva) tiempoGlobal += dt;

  sol.rotation.y = tiempoGlobal * 0.05;
  if (!vistaInteriorActiva) { actualizarEstrellasFugaces(dt); actualizarEstrellasBrillantes(tiempoGlobal); }
  if (solDesbloqueado) {
    const t = tiempoGlobal;
    const pulso = 1 + Math.sin(t * 3.0) * 0.06 + Math.sin(t * 7.0) * 0.02;
    halo.scale.setScalar(pulso * 1.1);
    sol.scale.setScalar(1 + Math.sin(t * 3.0) * 0.02);
    halo.material.opacity = 0.25 + Math.sin(t * 3.0) * 0.08;
    sunLight.intensity = 3.2 + Math.sin(t * 3.0) * 0.6;
    solParticulasMat.opacity = 0.75;
    actualizarParticulasSol(t);
    coronaExterior.scale.setScalar(pulso * 1.05);
    coronaExterior.material.opacity = 0.09 + Math.sin(t * 2.2) * 0.03;
    rayosSol.material.opacity = 0.5 + Math.sin(t * 1.6) * 0.15;
    rayosSol.material.rotation = t * 0.06;
  } else {
    halo.scale.setScalar(1 + Math.sin(tiempoGlobal * 1.5) * 0.045);
    coronaExterior.scale.setScalar(1 + Math.sin(tiempoGlobal * 1.5) * 0.03);
    coronaExterior.material.opacity = 0.045;
    rayosSol.material.opacity = 0.14;
    rayosSol.material.rotation = tiempoGlobal * 0.02;
  }
  estrellas.rotation.y = tiempoGlobal * 0.005;

  planetas.forEach(p => {
    const angulo = tiempoGlobal * p.cfg.velocidad;
    p.spinner.rotation.y = angulo;
    p.mesh.rotation.y = tiempoRotacion * 0.6;
    if (p.anillo) p.anillo.rotation.z = tiempoRotacion * 0.15;

    const estado = planetasTocados.get(p.cfg.id);
    if (estado) {
      estado.escalaActual += (estado.escalaObjetivo - estado.escalaActual) * 0.18;
      p.mesh.scale.setScalar(estado.escalaActual);
    }
    actualizarBrilloOrbita(p, angulo);
  });

  if (!vistaInteriorActiva) controls.update();
  if (usarPostFX && composer) composer.render();
  else renderer.render(scene, camera);
  if (rafActivo) requestAnimationFrame(animar);
}

animar();

// reanudamos el bucle al volver a la pestaña xddd
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    rafActivo = false;
  } else if (!rafActivo) {
    rafActivo = true;
    ultimaVez = performance.now();
    requestAnimationFrame(animar);
  }
});
</script>
